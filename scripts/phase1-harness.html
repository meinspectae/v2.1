<!doctype html><html><head><meta charset="utf-8"><title>Phase 1 local checks</title></head><body><div id="root"></div><script type="module">
import React from 'react';
import { createRoot } from 'react-dom/client';
import PortraitCapture from '/src/components/PortraitCapture.tsx';
import { client } from '/src/api/client.ts';
import { useInspectionStore } from '/src/store/inspectionStore.ts';
import { useAuthStore } from '/src/store/authStore.ts';
import { restorePhotos, retryPhotoBackups } from '/src/utils/draftBackup.ts';
const nativeFetch = window.fetch.bind(window);
window.qaUploads = []; window.qaFailUploads = false;
client.api.fetch = async (path, options = {}) => {
 const record = JSON.parse(localStorage.getItem('qa-cloud-record') || 'null');
 if (path === '/api/upload/photo') { const body=JSON.parse(options.body); const path=`photos/qa/${body.inspectionId}/${body.roomId}/${body.itemId}/${body.photoId}.jpg`; window.qaUploads.push(body); return new Response(JSON.stringify({uploadUrl:'/qa-upload',path})); }
 if(path.endsWith('/confirm')) return new Response('{}');
 if(path.endsWith('/photos')) { const photos=record ? [...record.overallPhotos,...record.rooms.flatMap(r=>r.items.flatMap(i=>i.photos))].filter(p=>p.cloudPath).map(p=>({id:p.id,cloudPath:p.cloudPath,metadata:p,downloadUrl:'/meinspect-logo.png'})) : []; return new Response(JSON.stringify({photos})); }
 if(options.method === 'PUT' || options.method === 'POST') { const body=JSON.parse(options.body||'{}'); if(body.rooms) localStorage.setItem('qa-cloud-record',JSON.stringify(body)); return new Response('{}'); }
 return new Response(JSON.stringify({data:record}));
};
window.fetch = async (url, options) => { if(url === '/qa-upload') return new Response('',{status:window.qaFailUploads?503:200}); return nativeFetch(url,options); };
useAuthStore.getState().setUser({id:'qa-local',name:'QA Inspector',email:'qa@example.test'});
window.qa = {store:useInspectionStore,restorePhotos,retryPhotoBackups};
window.openCrop = () => createRoot(document.getElementById('root')).render(React.createElement(PortraitCapture,{onSave:p=>window.qaCropped=p,onClose:()=>{}}));
document.body.dataset.ready='true';
</script></body></html>
